<!doctype html><html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#0d1714"><title>HONDA GO-ROKU | Gacha</title><link rel="stylesheet" href="./style.css"><link rel="stylesheet" href="./portrait-element.css?v=468c28d"><style>.bottom{align-items:end}.bottom [data-a="gacha"]{transform:translateY(-16px);min-height:66px;border:2px solid #f6d76c!important;background:#f2c94e!important;color:#17271e!important;box-shadow:0 10px 24px #0008}.bottom [data-a="gacha"] i{font-size:24px}.gacha{margin-top:12px;border-radius:26px}.gacha h2{font-size:39px!important}.gacha .ball{width:184px;height:184px}.gacha .draw{width:100%;font-size:17px}.gacha-note{margin:8px auto;color:#d3e0d8;font-size:11px;line-height:1.55}.retry{display:block;width:100%;margin-top:10px;border:0;border-radius:14px;background:#e9dfcb;color:#23352c;padding:13px;font-weight:1000}</style></head><body><main id="app" class="app"></main><nav id="nav" class="bottom"></nav><div id="modal" class="modal"><section id="sheet" class="sheet"></section></div><div id="toast" class="toast"></div><script src="./portrait-element.js"></script><script src="./data.js"></script><script src="./app-stable.js?v=722e27c"></script><script>(()=>{const go=()=>document.querySelector('.bottom [data-a="gacha"]')?.click();const add=()=>{const g=document.querySelector('.gacha');if(g&&!g.querySelector('.gacha-note')){const n=document.createElement('p');n.className='gacha-note';n.textContent='北中米・カタール・現役／引退後。全語録からランダムで引く。';g.querySelector('h2')?.after(n)}const r=document.querySelector('#result.show');if(r&&!r.querySelector('.retry')){const b=document.createElement('button');b.className='retry';b.textContent='⚽ もう1回引く';b.onclick=go;r.append(b)}};new MutationObserver(add).observe(document.body,{childList:true,subtree:true});setTimeout(()=>{go();add()},500)})();</script></body></html>
