    }

      color: var(--muted);

    }
    .pill {

      color: var(--ink);

      box-shadow: none;
      white-space: nowrap;

      background: var(--panel);
      color: var(--ink);

      background: var(--accent);
      color: #fff;
    }
    .tools {

      grid-template-columns: 1fr auto;
      gap: 8px;
      align-items: center;
    }
    .filter-row {
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      margin-top: 8px;
    }
    .search {
      width: 100%;
      min-height: 42px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: var(--panel);
      color: var(--ink);
      padding: 0 14px;

      background: var(--panel);
      color: var(--ink);
      padding: 0 14px;

      padding: 12px;
      box-shadow: var(--shadow);
      margin-bottom: 12px;

      gap: 10px;

      margin-bottom: 12px;

      border: 0;

      color: inherit;
      padding: 12px;
      text-align: left;

      margin-top: 10px;

      4:["イータ","エレナ","ドゥーン","リスト","レイザー"],
      5:["ゴレイヌ","カイト"],
      6:["爆弾魔（ボマー）","ボマー"],
      7:["フィンクス"],
      8:["オロソ兄妹","陰獣","ズシ","ウィング"],
      9:["メルエム","コムギ","ヒソカ"],
      10:["センリツ"],
      11:["カルト"],
      12:["フェイタン"],
      13:["モラウ"],
      14:["ゴトー"],
      15:["兵器ブリオン","ブリオン"],
      16:["ゴン"],
      17:["ビスケ"],
      18:["キルア","ゴン"],
      19:["イルミ","クロロの手刀を見逃さなかった人","ポックル","ポンズ","ビーンズ"],
      20:["ゼノ","シルバ"],
      21:["オウ＝ケンイ","オニオール＝ロンポウ","テータ","ナスビ＝ホイコーロ","バビマイナ","ヒンリギ＝ビガンダフノ","ビル","ブロッコ＝リー","モレナ＝プルード","アモリ三兄弟","キリコ","サトツ","ジョネス","トンパ","ハンゾー","ブハラ","メンチ","ミト"],
      22:["ネフェルピトー","ピトー","モントゥトゥユピー","ユピー","シャウアプフ","プフ"],
      23:["ノヴ","ウェルフィン"],
      24:["ネオン","ビヨンド","ノブナガ","ボノレノフ"],
      25:["カキン帝国王子"],
      26:["クロロ"],
      27:["十二支ん メンバー","十二支ん","バショウ","イカルゴ"],
      28:["ナックル","シュート","パーム","メレオロン"],
      29:["ウボォーギン","パクノダ","コルトピ","シャルナーク"],
      30:["アルカ","ナニカ","ゾルディック家","ミルキ"],
      31:[]
    };
    spots.forEach(spot => {
      spot.ch = characterMap[spot.o] || [];
    });
    spots.find(spot => spot.o === 21).c = "オウ＝ケンイ / オニオール＝ロンポウ / テータ / ナスビ＝ホイコーロ / バビマイナ / ヒンリギ＝ビガンダフノ / ビル / ブロッコ＝リー / モレナ＝プルード / アモリ三兄弟 / キリコ / サトツ / ジョネス / トンパ / ハンゾー / ブハラ / メンチ / ミト";
    const segmentNames = {
      all: "全地点",
      1: "Segment 1: 宮下公園・神南・宇田川町北側",
      2: "Segment 2: センター街密集地帯",
      3: "Segment 3: 道玄坂奥・円山町",
      4: "Segment 4: マークシティから駅へ"
    };
    const doneKey = "hxh-shibuya-done-v2";
    const savedActive = localStorage.getItem("hxh-active-seg");
    let active = savedActive === "all" ? "all" : Number(savedActive || 1);
    if (active !== "all" && ![1, 2, 3, 4].includes(active)) active = 1;
    let done = new Set(JSON.parse(localStorage.getItem(doneKey) || "[]"));
    let query = "";
    let selectedCharacter = localStorage.getItem("hxh-selected-character") || "";
    let locationState = null;
    let openSpot = null;

    const enc = encodeURIComponent;
    const normalize = text => String(text || "").toLowerCase().replace(/\s+/g, "");
    const coord = spot => `${spot.lat},${spot.lng}`;
    const spotUrl = spot => `https://www.google.com/maps/dir/?api=1&travelmode=walking&destination=${coord(spot)}`;
    const segmentUrl = seg => {
      const set = spots.filter(x => x.s === seg);
      const origin = coord(set[0]);
      const destination = coord(set.at(-1));
      const waypoints = set.slice(1, -1).map(x => coord(x)).join("%7C");
      return `https://www.google.com/maps/dir/?api=1&travelmode=walking&origin=${origin}&destination=${destination}&waypoints=${waypoints}`;
    };
    const meters = (a, b) => {
      const R = 6371000, toRad = x => x * Math.PI / 180;
      const dLat = toRad(b.lat - a.lat), dLng = toRad(b.lng - a.lng);
      const s1 = Math.sin(dLat / 2), s2 = Math.sin(dLng / 2);
      const c = s1 * s1 + Math.cos(toRad(a.lat)) * Math.cos(toRad(b.lat)) * s2 * s2;
      return Math.round(R * 2 * Math.atan2(Math.sqrt(c), Math.sqrt(1 - c)));
    };
    const saveDone = () => localStorage.setItem(doneKey, JSON.stringify([...done].sort((a,b)=>a-b)));
    const match = spot => {
      if (selectedCharacter && !spot.ch.includes(selectedCharacter)) return false;
      if (!query) return true;
      const q = normalize(query);
      const haystack = normalize([spot.n, spot.a, spot.p, spot.c, spot.m, spot.z, spot.ch.join(" ")].join(" "));
      return haystack.includes(q);
    };
    function renderCharacterSelect() {
      const select = document.getElementById("characterSelect");
      const counts = new Map();
      for (const spot of spots) {
        for (const ch of spot.ch) counts.set(ch, (counts.get(ch) || 0) + 1);
      }
      const options = [...counts.entries()].map(([name, count]) => `<option value="${name}">${name}${count > 1 ? ` (${count})` : ""}</option>`);
      select.innerHTML = `<option value="">キャラで選ぶ</option>${options.join("")}`;
      select.value = selectedCharacter;
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = [{id:"all", label:"全"}, {id:1,label:"S1"}, {id:2,label:"S2"}, {id:3,label:"S3"}, {id:4,label:"S4"}].map(t => {
        const selected = String(active) === String(t.id);
        return `<button class="tab" type="button" data-seg="${t.id}" aria-selected="${selected}">${t.label}</button>`;
      }).join("");
    }

    function render() {
      renderTabs();
      const list = document.getElementById("spotList");
      const globalFilter = Boolean(selectedCharacter || query);
      const visible = spots.filter(s => (globalFilter || active === "all" || s.s === active) && match(s));
      const completed = done.size;
      document.getElementById("progressText").textContent = `${completed}/${spots.length}`;
      document.getElementById("chapterTitle").textContent = selectedCharacter ? `キャラ: ${selectedCharacter}` : (query ? `検索: ${query}` : (segmentNames[active] || segmentNames.all));
      document.getElementById("hintText").textContent = (selectedCharacter || query) ? "条件に合うスポットだけを全Segmentから表示中です。解除で通常表示に戻ります。" : "カードをタップで詳細表示。黄色のボタンでその地点まで徒歩ナビを開きます。";
      const routeLink = document.getElementById("segmentMap");
      const routeTitle = document.getElementById("routeTitle");
      const routeDesc = document.getElementById("routeDesc");
      const routeSeg = active === "all" ? 1 : Number(active);
      routeLink.href = segmentUrl(routeSeg);
      routeLink.textContent = `S${routeSeg} ナビ`;
      routeTitle.textContent = `Segment ${routeSeg}の固定ルートを開く`;
      routeDesc.textContent = active === "all" ? "全表示中はSegment 1の固定ルートを開きます。" : "CSVのピン位置と同じ座標を順番に結びます。";
      if (!visible.length) {
        list.innerHTML = `<li class="empty">該当スポットがありません。</li>`;
        return;
      }
      list.innerHTML = visible.map(s => {
        const dist = locationState ? meters(locationState, s) : null;
        const nearest = locationState?.nearest === s.o;
        const near = dist !== null && dist <= 90;
        const isDone = done.has(s.o);
        const isOpen = openSpot === s.o;
        return `<li class="spot seg-${s.s}${nearest ? " nearest" : ""}${near ? " near" : ""}${isDone ? " done" : ""}${isOpen ? " open" : ""}" data-order="${s.o}">
          <button class="spot-head" type="button" data-toggle="${s.o}">
            <span class="num">${String(s.o).padStart(2, "0")}</span>
            <span>
              <span class="spot-title">${s.n}</span>
              <span class="addr">${s.a}</span>
              <span class="badge-row">
                <span class="badge">S${s.s}</span>
                <span class="badge">${s.z}</span>
                ${dist !== null ? `<span class="badge">${dist}m</span>` : ""}
                ${nearest ? `<span class="badge">最寄り</span>` : ""}
              </span>
            </span>
            <span class="chev">⌄</span>
          </button>
          <div class="spot-body">
            <div class="detail-grid">
              <div class="detail"><b>Characters</b>${s.c}</div>
              <div class="detail"><b>Spot</b>${s.p}</div>
              <div class="detail"><b>Notes</b>${s.m}</div>
            </div>
            <div class="actions">
              <a class="map-link" href="${spotUrl(s)}" target="_blank" rel="noopener">ここへ行く</a>
              <button class="done-btn" type="button" data-done="${s.o}">${isDone ? "未回収に戻す" : "回収済みにする"}</button>
            </div>
          </div>
        </li>`;
      }).join("");
    }

    function locate() {
      const status = document.getElementById("geoStatus");
      if (!navigator.geolocation) {
        status.textContent = "このブラウザでは現在地取得に対応していません。";
        return;
      }
      status.textContent = "現在地を取得中...";
      navigator.geolocation.getCurrentPosition(pos => {
        const here = {lat: pos.coords.latitude, lng: pos.coords.longitude};
        const nearest = spots.map(s => ({o:s.o, s:s.s, d:meters(here, s)})).sort((a,b)=>a.d-b.d)[0];
        locationState = {...here, nearest: nearest.o};
        active = nearest.s;
        localStorage.setItem("hxh-active-seg", active);
        openSpot = nearest.o;
        status.textContent = `最寄りは ${String(nearest.o).padStart(2, "0")} 番付近（約${nearest.d}m）。`;
        render();
        setTimeout(() => document.querySelector(`[data-order="${nearest.o}"]`)?.scrollIntoView({block:"center", behavior:"smooth"}), 80);
      }, err => {
        status.textContent = `現在地を取得できませんでした: ${err.message}`;
      }, {enableHighAccuracy:true, timeout:10000, maximumAge:20000});
    }
    async function shareApp() {
      const url = location.href.split("#")[0];
      const text = "HUNTER×HUNTER渋谷巡回イベント用のスマホ巡礼ナビ。Segment切替、回収チェック、Google Maps起動つき。";
      if (navigator.share) {
        try {
          await navigator.share({title:"HXH渋谷 巡回ナビ", text, url});
          return;
        } catch (_) {}
      }
      const intent = `https://twitter.com/intent/tweet?text=${enc(text)}&url=${enc(url)}`;
      window.open(intent, "_blank", "noopener");
    }

    document.addEventListener("click", e => {
      const seg = e.target.closest("[data-seg]");
      if (seg) {
        active = seg.dataset.seg === "all" ? "all" : Number(seg.dataset.seg);
        localStorage.setItem("hxh-active-seg", active);
        selectedCharacter = "";
        localStorage.removeItem("hxh-selected-character");
        document.getElementById("characterSelect").value = "";
        openSpot = null;
        render();
        window.scrollTo({top:0, behavior:"smooth"});
      }
      const toggle = e.target.closest("[data-toggle]");
      if (toggle) {
        const id = Number(toggle.dataset.toggle);
        openSpot = openSpot === id ? null : id;
        render();
      }
      const doneBtn = e.target.closest("[data-done]");
      if (doneBtn) {
        const id = Number(doneBtn.dataset.done);
        done.has(id) ? done.delete(id) : done.add(id);
        saveDone();
        render();
      }
    });
    document.getElementById("shareBtn").addEventListener("click", shareApp);
    document.getElementById("locateBtn").addEventListener("click", locate);
    document.getElementById("search").addEventListener("input", e => {
      query = e.target.value.trim();
      render();
    });
    document.getElementById("characterSelect").addEventListener("change", e => {
      selectedCharacter = e.target.value;
      if (selectedCharacter) {
        active = "all";
        localStorage.setItem("hxh-active-seg", "all");
        localStorage.setItem("hxh-selected-character", selectedCharacter);
        const first = spots.find(s => s.ch.includes(selectedCharacter));
        openSpot = first?.o || null;
      } else {
        localStorage.removeItem("hxh-selected-character");
        openSpot = null;
      }
      render();
      if (openSpot) setTimeout(() => document.querySelector(`[data-order="${openSpot}"]`)?.scrollIntoView({block:"center", behavior:"smooth"}), 80);
    });
    document.getElementById("clearFilterBtn").addEventListener("click", () => {
      selectedCharacter = "";
      query = "";
      openSpot = null;
      localStorage.removeItem("hxh-selected-character");
      document.getElementById("characterSelect").value = "";
      document.getElementById("search").value = "";
      render();
    });
    document.getElementById("nextBtn").addEventListener("click", () => {
      const scope = active === "all" ? spots : spots.filter(s => s.s === active);
      const next = scope.find(s => !done.has(s.o)) || spots.find(s => !done.has(s.o));
      if (!next) return;
      active = next.s;
      openSpot = next.o;
      localStorage.setItem("hxh-active-seg", active);
      render();
      setTimeout(() => document.querySelector(`[data-order="${next.o}"]`)?.scrollIntoView({block:"center", behavior:"smooth"}), 80);
    });

    if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
      const sw = `self.addEventListener('install',e=>self.skipWaiting());self.addEventListener('activate',e=>self.clients.claim());self.addEventListener('fetch',e=>{});`;
      navigator.serviceWorker.register(URL.createObjectURL(new Blob([sw], {type:"text/javascript"}))).catch(() => {});
    }
    renderCharacterSelect();
    render();
  </script>
</body>
</html>
